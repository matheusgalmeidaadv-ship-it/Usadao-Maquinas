<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Usadão Máquinas — Administração</title>
<style>
:root{--ink:#151515;--paper:#f4f4f1;--white:#fff;--orange:#f47d20;--green:#278b3e;--red:#b93636;--line:#ddd;--muted:#66707a}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Arial,Helvetica,sans-serif}.top{background:#080808;color:#fff;padding:16px 24px;display:flex;align-items:center;justify-content:space-between}.top b{font-size:20px}.top a{color:#fff;text-decoration:none;margin-left:16px}.wrap{max-width:1250px;margin:24px auto;padding:0 16px}.hero{display:flex;justify-content:space-between;align-items:end;margin-bottom:18px}.hero h1{margin:0 0 5px;font-size:30px}.hero p{margin:0;color:var(--muted)}.badge{padding:8px 12px;border-radius:20px;background:#e8f4ea;color:var(--green);font-weight:700}.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:20px;box-shadow:0 6px 20px #0000000d;margin-bottom:20px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.field label{display:block;font-weight:700;font-size:13px;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;border:1px solid #ccc;border-radius:8px;padding:11px 12px;background:#fff}.field textarea{min-height:90px;resize:vertical}.full{grid-column:1/-1}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.btn{border:0;border-radius:8px;padding:11px 15px;font-weight:700;cursor:pointer}.primary{background:var(--orange);color:#111}.secondary{background:#eee;color:#111}.publish{background:var(--green);color:#fff}.danger{background:var(--red);color:#fff}.notice{display:none;margin:12px 0;padding:12px;border-radius:8px;background:#fff4e9}.toolbar{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap}.toolbar input,.toolbar select{padding:10px;border:1px solid #ccc;border-radius:8px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:900px}th,td{text-align:left;padding:13px 10px;border-bottom:1px solid #eee;vertical-align:middle}th{font-size:12px;text-transform:uppercase;color:#687078}.status{display:inline-block;padding:5px 8px;border-radius:14px;font-size:12px;font-weight:700}.s-publicado{background:#e5f4e8;color:var(--green)}.s-rascunho{background:#fff1df;color:#a95a0b}.s-encerrado{background:#eee;color:#555}.row-actions{display:flex;gap:6px;flex-wrap:wrap}.small{padding:7px 9px;font-size:12px}.thumb{width:70px;height:50px;object-fit:cover;border-radius:6px;background:#eee}.empty{padding:30px;text-align:center;color:var(--muted)}@media(max-width:760px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.top{padding:14px}.hero{display:block}.badge{display:inline-block;margin-top:12px}}
</style></head><body>
<header class="top"><b>USADÃO MÁQUINAS — ADMIN</b><nav><a href="/" target="_blank">Ver site</a><a href="/admin">Painel</a></nav></header>
<main class="wrap"><div class="hero"><div><h1 id="formTitle">Cadastrar equipamento</h1><p>Gerencie os anúncios sem editar código.</p></div><span class="badge" id="apiState">API conectada</span></div>
<section class="card"><form id="form"><input type="hidden" id="id"><div class="grid">
<div class="field"><label>Título *</label><input id="titulo" required placeholder="Ex.: Trator John Deere 6110J"></div><div class="field"><label>Marca</label><input id="marca"></div>
<div class="field"><label>Modelo</label><input id="modelo"></div><div class="field"><label>Categoria</label><input id="categoria" placeholder="Tratores, Colheitadeiras..."></div>
<div class="field"><label>Setor</label><input id="setor" value="Agrícola"></div><div class="field"><label>Estado</label><select id="estado"><option>Usado</option><option>Novo</option><option>Revisado</option></select></div>
<div class="field"><label>Ano</label><input id="ano" type="number" min="1900" max="2100"></div><div class="field"><label>Lance inicial (R$)</label><input id="lance_inicial" type="number" min="0" step="0.01"></div>
<div class="field"><label>Data/hora do leilão</label><input id="data_leilao" type="datetime-local"></div><div class="field"><label>Localização</label><input id="localizacao" placeholder="Cidade/UF ou Conforme edital"></div>
<div class="field full"><label>Imagem (URL)</label><input id="imagem" type="url" placeholder="https://..."></div>
<div class="field full"><label>Descrição</label><textarea id="descricao"></textarea></div>
<div class="field"><label>Status</label><select id="status"><option value="rascunho">Rascunho</option><option value="publicado">Publicado</option><option value="encerrado">Encerrado</option></select></div>
</div><div id="notice" class="notice"></div><div class="actions"><button class="btn primary" type="submit" id="save">Salvar equipamento</button><button class="btn secondary" type="button" id="clear">Limpar / novo</button></div></form></section>
<section class="card"><div class="toolbar"><div><h2 style="margin:0">Equipamentos cadastrados</h2><small id="count" style="color:#687078"></small></div><div><input id="search" placeholder="Buscar..."><select id="filter"><option value="">Todos</option><option value="publicado">Publicados</option><option value="rascunho">Rascunhos</option><option value="encerrado">Encerrados</option></select><button class="btn secondary small" id="refresh">Atualizar</button></div></div><div class="table-wrap"><table><thead><tr><th>ID</th><th>Foto</th><th>Equipamento</th><th>Lance</th><th>Leilão</th><th>Status</th><th>Ações</th></tr></thead><tbody id="tbody"></tbody></table></div><div id="empty" class="empty" style="display:none">Nenhum equipamento encontrado.</div></section></main>
<script>
const $=id=>document.getElementById(id); let items=[];
function money(v){return v==null||v===''?'—':Number(v).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});}
function date(v){if(!v)return '—'; const d=new Date(v); return isNaN(d)?v:d.toLocaleString('pt-BR');}
function show(msg,ok=false){$('notice').textContent=msg;$('notice').style.display='block';$('notice').style.background=ok?'#e9f7ec':'#fff4e9';setTimeout(()=>{$('notice').style.display='none'},3500)}
function reset(){ $('form').reset(); $('id').value=''; $('setor').value='Agrícola'; $('estado').value='Usado'; $('status').value='rascunho'; $('formTitle').textContent='Cadastrar equipamento'; $('save').textContent='Salvar equipamento'; }
function fill(x){for(const k of ['titulo','marca','modelo','categoria','setor','estado','ano','lance_inicial','data_leilao','localizacao','imagem','descricao','status'])$(k).value=x[k]??''; $('id').value=x.id; $('formTitle').textContent='Editar equipamento #'+x.id; $('save').textContent='Atualizar equipamento'; window.scrollTo({top:0,behavior:'smooth'});}
function render(){const q=$('search').value.toLowerCase().trim(), f=$('filter').value; const list=items.filter(x=>(!f||x.status===f)&&(!q||`${x.titulo} ${x.marca} ${x.modelo} ${x.categoria}`.toLowerCase().includes(q)));$('count').textContent=`${list.length} resultado(s)`;$('empty').style.display=list.length?'none':'block';$('tbody').innerHTML=list.map(x=>`<tr><td>${x.id}</td><td>${x.imagem?`<img class="thumb" src="${x.imagem}" onerror="this.style.display='none'">`:'—'}</td><td><b>${esc(x.titulo)}</b><br><small>${esc(x.marca||'')} ${esc(x.modelo||'')}</small></td><td>${money(x.lance_inicial)}</td><td>${date(x.data_leilao)}</td><td><span class="status s-${x.status}">${x.status}</span></td><td><div class="row-actions"><button class="btn secondary small" onclick="edit(${x.id})">Editar</button>${x.status==='publicado'?`<button class="btn secondary small" onclick="status(${x.id},'rascunho')">Despublicar</button>`:`<button class="btn publish small" onclick="status(${x.id},'publicado')">Publicar</button>`}<button class="btn danger small" onclick="del(${x.id})">Excluir</button></div></td></tr>`).join('');}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
async function load(){try{const r=await fetch('/api/equipamentos');if(!r.ok)throw 0;items=await r.json();$('apiState').textContent='API conectada';render()}catch(e){$('apiState').textContent='API com erro';show('Não foi possível carregar os equipamentos. Verifique se o servidor está ligado.')}}
$('form').onsubmit=async e=>{e.preventDefault();const x={};for(const k of ['titulo','marca','modelo','categoria','setor','estado','ano','lance_inicial','data_leilao','localizacao','imagem','descricao','status'])x[k]=$(k).value;const id=$('id').value;const r=await fetch(id?'/api/equipamentos/'+id:'/api/equipamentos',{method:id?'PUT':'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(x)});if(!r.ok){const z=await r.json().catch(()=>({}));return show(z.error||'Erro ao salvar')}show(id?'Equipamento atualizado!':'Equipamento cadastrado!',true);reset();load()};
window.edit=async id=>{const r=await fetch('/api/equipamentos/'+id);fill(await r.json())};
window.status=async(id,s)=>{const r=await fetch('/api/equipamentos/'+id+'/status',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:s})});if(r.ok){show(s==='publicado'?'Equipamento publicado!':'Equipamento voltou para rascunho.',true);load()}else show('Não foi possível alterar o status')};
window.del=async id=>{if(!confirm('Excluir este equipamento?'))return;const r=await fetch('/api/equipamentos/'+id,{method:'DELETE'});if(r.ok){show('Equipamento excluído.',true);load()}else show('Não foi possível excluir')};
$('clear').onclick=reset;$('refresh').onclick=load;$('search').oninput=render;$('filter').onchange=render;load();
</script></body></html>
