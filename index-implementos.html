<style id="usadao-checkout-v1">
#um-checkout{position:fixed;inset:0;z-index:99999;display:none;background:rgba(5,9,7,.82);backdrop-filter:blur(8px);overflow:auto;padding:24px}
#um-checkout.um-open{display:flex;align-items:center;justify-content:center}
#um-panel{width:min(980px,100%);max-height:calc(100vh - 48px);overflow:auto;background:#f7f5ef;border-radius:18px;box-shadow:0 30px 90px rgba(0,0,0,.45);font-family:inherit;color:#151815}
#um-head{display:flex;justify-content:space-between;align-items:flex-start;padding:24px 28px;border-bottom:1px solid #ddd9cf;background:#111713;color:#fff;border-radius:18px 18px 0 0}
#um-head h2{margin:0;font-size:28px}#um-head p{margin:6px 0 0;color:#c9d0c9;font-size:13px}
#um-close{border:0;background:#2a302b;color:#fff;width:38px;height:38px;border-radius:50%;cursor:pointer;font-size:22px}
#um-body{padding:26px}.um-grid{display:grid;grid-template-columns:1.2fr .8fr;gap:22px}
.um-card{background:#fff;border:1px solid #dedbd2;border-radius:14px;padding:20px}.um-card h3{margin:0 0 14px;font-size:19px}
.um-muted{color:#697069;font-size:13px;line-height:1.5}.um-stepper{display:flex;gap:8px;margin-bottom:22px;flex-wrap:wrap}
.um-step{padding:8px 12px;border-radius:999px;background:#e9e8e2;color:#686d67;font-size:12px;font-weight:700}.um-step.active{background:#278b3e;color:#fff}
.um-equip{display:flex;gap:14px;align-items:center}.um-equip img{width:112px;height:78px;object-fit:cover;border-radius:10px;background:#ddd}
.um-price{font-size:25px;font-weight:800;margin-top:4px}.um-field{display:grid;gap:6px;margin:12px 0}.um-field label{font-size:12px;font-weight:700}
.um-field input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #cfcfc8;border-radius:9px;background:#fff;font:inherit}
.um-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}.um-btn{border:0;border-radius:9px;padding:13px 17px;font-weight:800;cursor:pointer}
.um-primary{background:#278b3e;color:#fff}.um-secondary{background:#e9e8e2;color:#1c211d}
.um-total{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #e5e2da;font-size:14px}.um-total.final{border-bottom:0;font-size:20px;font-weight:900;padding-top:15px}
.um-pay-option{display:flex;align-items:center;gap:10px;border:1px solid #d8d5cc;border-radius:10px;padding:13px;margin:9px 0;cursor:pointer;background:#fff}
.um-pay-option input{accent-color:#278b3e}.um-security{display:flex;gap:9px;align-items:flex-start;background:#eef6ef;border:1px solid #cfe4d1;border-radius:10px;padding:12px;margin-top:14px;font-size:12px;line-height:1.45}
.um-warning{background:#fff7e9;border:1px solid #ead6ad;border-radius:10px;padding:12px;margin-top:14px;font-size:12px;line-height:1.5}
.um-success{text-align:center;padding:30px 10px}.um-check{width:58px;height:58px;border-radius:50%;background:#278b3e;color:#fff;display:grid;place-items:center;font-size:30px;margin:0 auto 14px}
@media(max-width:760px){#um-checkout{padding:8px}.um-grid{grid-template-columns:1fr}.um-equip img{width:90px}.um-price{font-size:21px}}
</style>

else if(st.step===2)b.innerHTML=steps()+'<div class="um-grid"><div class="um-card"><h3>Cadastro do participante</h3><div class="um-field"><label>Nome completo</label><input id="um-name" autocomplete="name"></div><div class="um-field"><label>CPF/CNPJ</label><input id="um-cpf" inputmode="numeric"></div><div class="um-field"><label>E-mail</label><input id="um-email" type="email" value="usadaomaquinas@proton.me" autocomplete="email"></div><div class="um-security">✓ <span>Os dados devem ser validados no ambiente autenticado antes de um lance real.</span></div></div><div class="um-card"><h3>Resumo</h3><div class="um-total"><span>Lance</span><strong>'+money(st.bid)+'</strong></div><div class="um-total"><span>Comissão/taxas</span><strong>Conforme edital</strong></div><div class="um-total final"><span>Total base</span><strong>'+money(st.bid)+'</strong></div><div class="um-warning">Este arquivo é um protótipo e não realiza cobrança.</div><div class="um-actions"><button class="um-btn um-secondary" id="um-b2">Voltar</button><button class="um-btn um-primary" id="um-n2">Pagamento</button></div></div></div>';

as+'x</span><strong>'+money(parcela)+'</strong></div><div class="um-warning"><strong>Ambiente demonstrativo.</strong> Nenhum pagamento real é processado. A condição definitiva depende do edital e do contrato.</div><div class="um-actions"><button class="um-btn um-secondary" id="um-b3">Voltar</button><button class="um-btn um-primary" id="um-p">Gerar instrução</button></div></div></div>';}

else {var lab=st.payment==="pix"?"PIX":st.payment==="boleto"?"Boleto":"Cartão";b.innerHTML='<div class="um-success"><div class="um-check">✓</div><h2>Fluxo preparado</h2><p class="um-muted">Lote '+esc(i.lot)+' associado ao participante '+esc(st.name)+'.</p><div class="um-card" style="text-align:left;max-width:620px;margin:20px auto"><div class="um-total"><span>Equipamento</span><strong>'+esc(i.title)+'</strong></div><div class="um-total"><span>Valor</span><strong>'+money(st.bid)+'</strong></div><div class="um-total"><span>Forma</span><strong>'+lab+'</strong></div><div class="um-total final"><span>Status</span><strong>Aguardando integração</strong></div></div><div class="um-security" style="max-width:620px;margin:0 auto 16px;text-align:left">✓ <span>Para produção, conectar backend seguro, autenticação, gateway, comprovante e atualização do status do lote.</span></div><button class="um-btn um-primary" id="um-f">Fechar</button></div>'}
var c=document.getElementById("um-c1");if(c)c.onclick=close;var n=document.getElementById("um-n1");if(n)n.onclick=function(){var v=Number(document.getElementById("um-bid").value);if(!Number.isFinite(v)||v<(i.price||0))return alert("Informe um lance válido.");st.bid=v;st.step=2;render()};

<script>
(function(){
  const TAXA_USADAO = 0.005;
  const fmtBR = v => new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(v);
  function parseBR(v){
    return Number(String(v || '').replace(/[^\d,.-]/g,'').replace(/\./g,'').replace(',','.'));
  }
  function atualizarParcelamento05(){
    const root=document.getElementById('um-checkout');
    if(!root) return;
    const bidEl=root.querySelector('[data-um-bid], #um-bid, input[name="bid"]');
    const parcelasEl=root.querySelector('[data-um-parcelas], #um-parcelas, select[name="parcelas"]');
    if(!bidEl || !parcelasEl) return;
    const bid=parseBR(bidEl.value || bidEl.dataset.value);
    const n=Math.max(1,Number(parcelasEl.value)||1);
    if(!Number.isFinite(bid)||bid<=0) return;
    const entrada=bid*0.25, saldo=bid*0.75;
    const parcela=n===1 ? saldo : saldo*(TAXA_USADAO*Math.pow(1+TAXA_USADAO,n))/(Math.pow(1+TAXA_USADAO,n)-1);
    const totalParcelas=parcela*n;
    let box=root.querySelector('#um-parcelamento-05');
    if(!box){
      box=document.createElement('div');
      box.id='um-parcelamento-05';
      box.style.cssText='margin-top:14px;padding:14px;border:1px solid rgba(39,139,62,.25);border-radius:12px;background:#f7fbf7;font-size:.95rem;line-height:1.65';
      (parcelasEl.closest('label,div')||parcelasEl.parentElement||root).appendChild(box);
    }
    box.innerHTML='<strong>Simulação de financiamento</strong><br>Entrada (25%): <strong>'+fmtBR(entrada)+'</strong><br>Saldo para parcelar (75%): <strong>'+fmtBR(saldo)+'</strong><br>Parcela estimada em <strong>'+n+'x</strong>: <strong>'+fmtBR(parcela)+'</strong><br>Total das parcelas: <strong>'+fmtBR(totalParcelas)+'</strong><br><span style="font-size:.82rem;opacity:.75">Taxa simulada: 0,50% ao mês. A taxa efetiva pode variar conforme crédito, garantias, instituição financeira e contrato.</span>';
  }
  const obs=new MutationObserver(atualizarParcelamento05);
  obs.observe(document.documentElement,{childList:true,subtree:true});
  document.addEventListener('input',atualizarParcelamento05,true);
  document.addEventListener('change',atualizarParcelamento05,true);
  document.addEventListener('click',function(){setTimeout(atualizarParcelamento05,50);setTimeout(atualizarParcelamento05,250);},true);
})();
</script>


<script>
(function(){
  const PIX_TESTE='123456789';
  function setupPixTeste(){
    const root=document.getElementById('um-checkout');
    if(!root) return;
    const labels=[...root.querySelectorAll('label,button,div,span')];
    const pix=labels.find(el=>el.textContent && el.textContent.trim().toUpperCase()==='PIX');
    if(!pix || root.querySelector('#um-pix-teste')) return;

    const box=document.createElement('div');
    box.id='um-pix-teste';
    box.style.cssText='margin-top:16px;padding:18px;border:1px solid #d9d9d9;border-radius:14px;background:#fff;display:none';
    box.innerHTML=
      '<div style="font-weight:800;font-size:1.05rem;margin-bottom:8px">Pagamento via PIX</div>'+
      '<div style="font-size:.9rem;margin-bottom:12px">Teste de integração — esta chave é apenas demonstrativa.</div>'+
      '<div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">'+
        '<div style="width:180px;height:180px;border:1px dashed #bbb;border-radius:10px;display:grid;place-items:center;background:#fafafa;text-align:center;padding:12px">'+
          '<strong>QR CODE PIX</strong><br><small>Chave de teste:<br>'+PIX_TESTE+'</small>'+
        '</div>'+
        '<div style="flex:1;min-width:230px">'+
          '<div style="font-size:.8rem;opacity:.7;margin-bottom:5px">PIX copia e cola</div>'+
          '<input id="um-pix-chave-teste" readonly value="'+PIX_TESTE+'" style="width:100%;box-sizing:border-box;padding:11px;border:1px solid #ccc;border-radius:8px;font-family:monospace">'+
          '<button type="button" id="um-pix-copiar-teste" style="margin-top:9px;width:100%;padding:11px;border:0;border-radius:8px;cursor:pointer;font-weight:700">Copiar código PIX</button>'+
          '<div id="um-pix-status-teste" style="font-size:.82rem;margin-top:8px;min-height:18px"></div>'+
        '</div>'+
      '</div>'+
      '<div style="margin-top:12px;padding:10px;border-radius:8px;background:#fff8e8;font-size:.82rem">⚠️ <strong>Importante:</strong> 123456789 é somente uma chave de teste. Não use esta chave para receber dinheiro real.</div>';

    const paymentText=labels.find(el=>el.textContent && /pix/i.test(el.textContent));
    (paymentText?.parentElement || root).appendChild(box);

    function refresh(){
      const selected=root.querySelector('input[type="radio"]:checked');
      const text=(selected?.value || selected?.nextElementSibling?.textContent || '').toLowerCase();
      const visible = /pix/.test(text) || (paymentText && /pix/i.test(paymentText.textContent));
      box.style.display=visible?'block':'none';
    }

    root.addEventListener('click',function(e){
      if(e.target && e.target.id==='um-pix-copiar-teste'){
        navigator.clipboard?.writeText(PIX_TESTE).then(()=>{
          document.getElementById('um-pix-status-teste').textContent='Código PIX copiado.';
        }).catch(()=>{
          const input=document.getElementById('um-pix-chave-teste');
          input.select(); document.execCommand('copy');
          document.getElementById('um-pix-status-teste').textContent='Código PIX copiado.';
        });
      }
    });
    root.addEventListener('change',refresh);
    refresh();
  }
  new MutationObserver(setupPixTeste).observe(document.documentElement,{childList:true,subtree:true});
  document.addEventListener('click',()=>setTimeout(setupPixTeste,100),true);
  setupPixTeste();
})();
</script>

<script>
(function(){
  const PLACEHOLDER='https://images.unsplash.com/photo-1581094794329-c8112a89af12?auto=format&fit=crop&w=900&q=80';
  function money(v){return Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});}
  function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
  async function load(){
    let data=[];
    try{
      const r=await fetch('/api/equipamentos?status=publicado',{cache:'no-store'});
      if(!r.ok) throw new Error('API '+r.status);
      data=await r.json();
    }catch(e){
      console.warn('API do Usadão não disponível:',e);
      return;
    }
    let sec=document.getElementById('backend-equipment-section');
    if(!sec){
      sec=document.createElement('section');sec.id='backend-equipment-section';
      const footer=document.querySelector('footer');
      (footer?footer.parentNode:document.body).insertBefore(sec,footer||null);
    }
    sec.innerHTML='<div class="backend-head"><div><div style="font-size:12px;letter-spacing:.12em;font-weight:800">BANCO DE DADOS</div><h2>Equipamentos publicados</h2><p style="margin:6px 0 0;color:#666">Esta lista vem automaticamente do painel administrativo.</p></div><div class="backend-status">● API CONECTADA · '+data.length+' PUBLICADO(S)</div></div>'+
      (data.length?'<div class="backend-grid">'+data.map(x=>`<article class="backend-card"><img src="${esc(x.imagem||PLACEHOLDER)}" onerror="this.src='${PLACEHOLDER}'"><div class="backend-card-body"><h3>${esc(x.titulo)}</h3><div class="backend-meta">${esc(x.marca||'')} ${esc(x.modelo||'')}<br>${esc(x.categoria||'')} · ${esc(x.estado||'')} ${x.ano?'· '+esc(x.ano):''}<br>📍 ${esc(x.localizacao||'Conforme edital')}</div><div class="backend-price">${money(x.lance_inicial)}</div></div></article>`).join('')+'</div>':'<div class="backend-empty">Nenhum equipamento publicado no momento. Cadastre uma máquina no <a class="backend-admin-link" href="/admin">painel administrativo</a>.</div>');
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',load); else load();
  setInterval(load,15000);
})();
</script>
